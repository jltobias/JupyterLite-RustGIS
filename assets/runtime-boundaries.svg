<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
<title id="title">Runtime boundaries</title><desc id="desc">JupyterLite runs browser Python; RustGIS Web runs its own WebAssembly app; native RustGIS and Ollama run locally. GeoJSON files and explicit URLs connect them.</desc>
<rect width="1080" height="370" rx="24" fill="#11243a"/><text x="42" y="64" fill="white" font-family="Arial,sans-serif" font-size="35" font-weight="700">Where each part runs</text>
<g font-family="Arial,sans-serif"><rect x="43" y="106" width="295" height="188" rx="18" fill="#174b63" stroke="#71d9d5" stroke-width="3"/><rect x="392" y="106" width="295" height="188" rx="18" fill="#174b63" stroke="#71d9d5" stroke-width="3"/><rect x="741" y="106" width="295" height="188" rx="18" fill="#725033" stroke="#f2bb72" stroke-width="3"/><g fill="white" font-size="25" font-weight="700"><text x="69" y="152">JupyterLite</text><text x="418" y="152">RustGIS Web</text><text x="767" y="152">Local machine</text></g><g fill="#d2eaef" font-size="18"><text x="69" y="195">Pyodide Python</text><text x="69" y="226">STAC metadata</text><text x="69" y="257">Charts + exports</text><text x="418" y="195">RustGIS WebAssembly</text><text x="418" y="226">Open GeoJSON / map</text><text x="418" y="257">No Python package</text><text x="767" y="195">Native RustGIS Python / CLI</text><text x="767" y="226">Ollama model service</text><text x="767" y="257">Explicit local setup</text></g></g>
<text x="165" y="335" fill="#f8c46b" font-family="Arial,sans-serif" font-size="19">GeoJSON + provenance →</text><text x="530" y="335" fill="#f8c46b" font-family="Arial,sans-serif" font-size="19">← downloaded project / files →</text>
