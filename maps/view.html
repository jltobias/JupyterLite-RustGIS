<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JupyterLite–RustGIS maps</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>html,body{margin:0;height:100%;font:16px system-ui;background:#101c2d;color:#f2f6f8}header{display:flex;align-items:center;gap:1.3rem;flex-wrap:wrap;padding:.7rem 1rem}a{color:#89dfee}h1{font-size:1.1rem;margin:0}main{height:calc(100% - 100px);min-height:450px}#map{height:100%}.note{position:absolute;z-index:2;top:100px;left:12px;max-width:330px;background:#14283bdd;padding:.8rem;border-radius:8px;line-height:1.4;font-size:.9rem}.maplibregl-popup-content{color:#172638}footer{font-size:.75rem;padding:.5rem 1rem}</style></head>
<body><header><h1 id="title">Maps</h1><nav><a href="../index.html">Home</a> · <a href="2d.html">2D map</a> · <a href="3d.html">3D map</a> · <a href="scene.html">3D scene</a> · <a href="../lab/index.html">Lab</a> · <a href="../book/index.html">Book</a></nav></header><div class="note" id="note"></div><main><div id="map" role="img" aria-label="Interactive map of illustrative features near Washington DC"></div></main><footer>Illustrative features and invented heights. Basemap © OpenStreetMap contributors. Map rendering © MapLibre contributors.</footer>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const mode = location.pathname.endsWith('scene.html') ? 'scene' : location.pathname.endsWith('3d.html') ? '3d' : '2d';
const labels={"2d":"2D map","3d":"3D extruded map",scene:"3D scene"};
document.title=labels[mode]+" | JupyterLite–RustGIS"; document.getElementById('title').textContent=labels[mode];
document.getElementById('note').textContent=mode==='2d'?'Click a feature to inspect it. Polygons and observation points are illustrative.':mode==='3d'?'Drag to rotate and tilt. Extrusion heights are invented teaching values, in metres.':'A pitched scene of the same teaching footprints and points. Drag to explore the perspective; heights are invented.';
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[-77.039,38.9045],zoom:mode==='scene'?16.6:mode==='3d'?16:15.4,pitch:mode==='2d'?0:mode==='3d'?58:72,bearing:mode==='scene'?-35:mode==='3d'?22:0});
map.addControl(new maplibregl.NavigationControl(),'top-right');
map.on('load',async()=>{try{const response=await fetch('../data/demo_features.geojson');if(!response.ok)throw Error(response.status);const geo=await response.json();map.addSource('features',{type:'geojson',data:geo});map.addLayer({id:'footprints',type:mode==='2d'?'fill':'fill-extrusion',source:'features',filter:['==',['geometry-type'],'Polygon'],paint:mode==='2d'?{'fill-color':'#ed8d58','fill-opacity':.72,'fill-outline-color':'#19364c'}:{'fill-extrusion-color':['interpolate',['linear'],['get','height_m'],0,'#46bed2',100,'#ed8855'],'fill-extrusion-height':['get','height_m'],'fill-extrusion-base':0,'fill-extrusion-opacity':.86}});map.addLayer({id:'observations',type:'circle',source:'features',filter:['==',['geometry-type'],'Point'],paint:{'circle-radius':9,'circle-color':'#ffe48a','circle-stroke-color':'#133b59','circle-stroke-width':3}});for(const id of ['footprints','observations'])map.on('click',id,e=>{const p=e.features[0].properties;new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<strong>${p.name}</strong><br>${p.kind==='footprint'?'Illustrative height: '+p.height_m+' m':'Illustrative observation point'}`).addTo(map)});}catch(error){document.getElementById('note').textContent='Could not load local data: '+error.message}});
</script></body></html>
